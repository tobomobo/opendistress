# SPDX-License-Identifier: MIT
name: Native clients

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  wearos:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-disabled: true
      - name: Test Wear OS and phone provisioning
        run: >-
          apps/wearos/gradlew --no-daemon -p apps/wearos
          :shared:testDebugUnitTest
          :mobile:testDebugUnitTest
          :app:testDebugUnitTest
      - name: Lint Wear OS and phone provisioning
        run: >-
          apps/wearos/gradlew --no-daemon -p apps/wearos
          :shared:lintDebug
          :mobile:lintDebug
          :app:lintDebug
      - name: Compile Wear OS and phone artifacts
        run: >-
          apps/wearos/gradlew --no-daemon -p apps/wearos
          :mobile:assembleDebug
          :app:assembleDebug
          :mobile:bundleRelease
          :app:bundleRelease
      - name: Stage paired Pixel Watch debug installers
        run: |
          mkdir -p "$RUNNER_TEMP/opendistress-pixel-watch-install-pair"
          cp apps/wearos/mobile/build/outputs/apk/debug/mobile-debug.apk \
            "$RUNNER_TEMP/opendistress-pixel-watch-install-pair/OpenDistress-Android-Setup-debug.apk"
          cp apps/wearos/app/build/outputs/apk/debug/app-debug.apk \
            "$RUNNER_TEMP/opendistress-pixel-watch-install-pair/OpenDistress-Pixel-Watch-debug.apk"
          cd "$RUNNER_TEMP/opendistress-pixel-watch-install-pair"
          sha256sum *.apk > SHA256SUMS.txt
      - name: Upload paired Pixel Watch debug installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opendistress-pixel-watch-install-pair-${{ github.sha }}
          path: ${{ runner.temp }}/opendistress-pixel-watch-install-pair
          if-no-files-found: error
          retention-days: 14
      - name: Stage unsigned Play Console bundles
        run: |
          mkdir -p "$RUNNER_TEMP/opendistress-pixel-watch-unsigned-bundles"
          cp apps/wearos/mobile/build/outputs/bundle/release/mobile-release.aab \
            "$RUNNER_TEMP/opendistress-pixel-watch-unsigned-bundles/OpenDistress-Android-Setup-release-unsigned.aab"
          cp apps/wearos/app/build/outputs/bundle/release/app-release.aab \
            "$RUNNER_TEMP/opendistress-pixel-watch-unsigned-bundles/OpenDistress-Pixel-Watch-release-unsigned.aab"
          cd "$RUNNER_TEMP/opendistress-pixel-watch-unsigned-bundles"
          sha256sum *.aab > SHA256SUMS.txt
      - name: Upload unsigned Play Console bundles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opendistress-pixel-watch-unsigned-bundles-${{ github.sha }}
          path: ${{ runner.temp }}/opendistress-pixel-watch-unsigned-bundles
          if-no-files-found: error
          retention-days: 14

  watchos:
    runs-on: macos-26
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compile watch-only app
        run: >-
          xcodebuild
          -project apps/watchos/OpenDistressWatch.xcodeproj
          -scheme OpenDistressWatch
          -configuration Debug
          -destination 'generic/platform=watchOS'
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Archive watch-only app
        run: >-
          xcodebuild
          -project apps/watchos/OpenDistressWatch.xcodeproj
          -scheme OpenDistressWatch
          -configuration Release
          -destination 'generic/platform=watchOS'
          -archivePath "$RUNNER_TEMP/OpenDistressWatch.xcarchive"
          CODE_SIGNING_ALLOWED=NO
          archive
      - name: Test watchOS
        run: |
          watch_id="$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          matches = [
              device["udid"]
              for runtime, entries in devices.items()
              if runtime.endswith("watchOS-26-5")
              for device in entries
              if device["name"] == "Apple Watch Series 11 (46mm)"
          ]
          if len(matches) != 1:
              raise SystemExit(f"expected one watchOS simulator, found {len(matches)}")
          print(matches[0])
          ')"
          xcodebuild \
            -project apps/watchos/OpenDistressWatch.xcodeproj \
            -scheme OpenDistressWatch \
            -configuration Debug \
            -destination "platform=watchOS Simulator,id=${watch_id}" \
            -enableAddressSanitizer YES \
            test
