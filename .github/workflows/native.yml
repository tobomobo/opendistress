# SPDX-License-Identifier: MIT
name: Native clients

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  wearos:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@0f4528296b4bc09e8ae0fc7be30185a4ab435545 # v6.0.0
        with:
          gradle-version: "8.11.1"
          cache-disabled: true
      - name: Compile and test Wear OS
        run: gradle --no-daemon -p apps/wearos :app:testDebugUnitTest :app:assembleDebug

  watchos:
    runs-on: macos-26
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compile watch-only app
        run: >-
          xcodebuild
          -project apps/watchos/PanicWatch.xcodeproj
          -scheme PanicWatch
          -configuration Debug
          -destination 'generic/platform=watchOS'
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Archive watch-only app
        run: >-
          xcodebuild
          -project apps/watchos/PanicWatch.xcodeproj
          -scheme PanicWatch
          -configuration Release
          -destination 'generic/platform=watchOS'
          -archivePath "$RUNNER_TEMP/PanicWatch.xcarchive"
          CODE_SIGNING_ALLOWED=NO
          archive
      - name: Test watchOS
        run: |
          watch_id="$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          matches = [
              device["udid"]
              for runtime, entries in devices.items()
              if runtime.endswith("watchOS-26-5")
              for device in entries
              if device["name"] == "Apple Watch Series 11 (46mm)"
          ]
          if len(matches) != 1:
              raise SystemExit(f"expected one watchOS simulator, found {len(matches)}")
          print(matches[0])
          ')"
          xcodebuild \
            -project apps/watchos/PanicWatch.xcodeproj \
            -scheme PanicWatch \
            -configuration Debug \
            -destination "platform=watchOS Simulator,id=${watch_id}" \
            -enableAddressSanitizer YES \
            test
